<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The opening picture's night, then the app's porcelain (src/intro.ts). -->
    <meta name="theme-color" content="#1F2A1F" />
    <title>Booking platform — Business</title>
    <!-- The customer app's face (§133), so the two apps read as one product. -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      The opening picture (§302), drawn by this page rather than by the app, so
      it starts the moment the page arrives and plays while the app loads.
      Pure CSS: nothing here waits for a script (and the browser policy allows
      none inline). The app takes it away once it has drawn (src/intro.ts).

      Every element's own style is the FINAL picture; each animation only says
      where it comes from ("both" holds it there until it starts). So with
      "reduce motion" on, the animations are simply switched off and the
      finished picture is what shows.

      The night is a curtain whose lower edge is the front hill; the paper
      under it is the ground. To leave, the ground melts into the app while the
      curtain lifts away — so the app is what appears, never a blank page.

      The same picture, timings and hills as the customer app's
      (apps/customer-app/public/index.html, src/ui/Intro.tsx), on this app's
      porcelain: change them together.
    -->
    <style id="intro-style">
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 800;
        /* The name comes in a second after the page: by then the font is here,
           and an invisible beat is better than a name that changes face. */
        font-display: block;
        src: url('/fonts/plus-jakarta-sans-latin.woff2') format('woff2');
      }
      html {
        background: #1f2a1f;
      }
      html.intro-gone {
        background: #f9f8f6;
      }
      #intro {
        --tile: 110px;
        --lift: -50px;
        --hill-h: clamp(150px, 27vh, 270px);
        /* Far enough up that the curtain's edge has left the screen. */
        --away: calc(-100vh - var(--hill-h));
        --paper: #f9f8f6;
        --orange: #fd7511;
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        overflow: hidden;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* The ground, under the curtain: what shows below the front hill. */
      .in-ground {
        position: absolute;
        inset: 0;
        background: var(--paper);
      }

      /* The night: a curtain from above the screen down to the front hill,
         which comes up from below when the booking is made. */
      .in-sky {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: calc(100vh + var(--hill-h));
      }
      .in-sky-rise {
        display: flex;
        flex-direction: column;
        height: 100%;
        animation: in-dawn 0.66s cubic-bezier(0.33, 1, 0.68, 1) 1.1s both;
      }
      .in-night {
        flex: 1;
        margin-bottom: -1px;
        background: #1f2a1f;
      }
      .in-sky svg {
        display: block;
        flex: none;
        width: 100%;
        height: var(--hill-h);
      }
      .in-sky path {
        fill: #1f2a1f;
      }

      /* The sun behind the tile, up when the booking is made. */
      .in-sun {
        position: absolute;
        inset: 0;
      }
      .in-glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% calc(50% + var(--lift)),
          rgba(253, 117, 17, 0.34) 0,
          rgba(253, 117, 17, 0.12) 24%,
          rgba(253, 117, 17, 0) 54%
        );
        animation: in-glow 0.8s cubic-bezier(0.33, 1, 0.68, 1) 0.94s both;
      }

      /* A thousand hills: two pale veils on the night. (Below the front hill
         they lie on the paper, where paper on paper cannot be seen.) */
      .in-hills {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--hill-h);
      }
      .in-hill {
        position: absolute;
        inset: 0;
      }
      .in-rise {
        position: absolute;
        inset: 0;
        animation: in-rise 0.66s cubic-bezier(0.33, 1, 0.68, 1) 0.94s both;
      }
      .in-hill-2 .in-rise {
        animation-delay: 1.02s;
      }
      .in-hill svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .in-hill-1 path {
        fill: rgba(246, 244, 240, 0.07);
      }
      .in-hill-2 path {
        fill: rgba(246, 244, 240, 0.14);
      }

      /* The mark: the tile the phone's launch screen shows, then the "b"
         written, the check, a pop and two rings, and up it goes. */
      .in-center {
        position: absolute;
        inset: 0;
      }
      .in-mark {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--tile);
        height: var(--tile);
        margin: calc(var(--tile) / -2) 0 0 calc(var(--tile) / -2);
        transform: translateY(var(--lift));
        animation: in-lift 0.56s cubic-bezier(0.33, 1, 0.68, 1) 1.02s both;
      }
      .in-tile,
      .in-ring {
        position: absolute;
        inset: 0;
        border-radius: calc(var(--tile) * 0.235);
      }
      .in-tile {
        background: #fff;
        animation: in-pop 0.52s cubic-bezier(0.33, 1, 0.68, 1) 0.94s both;
      }
      .in-tile svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .in-ring {
        border: 2px solid var(--orange);
        opacity: 0;
        animation:
          in-ring 0.9s cubic-bezier(0.33, 1, 0.68, 1) 0.94s,
          in-wait 2s cubic-bezier(0.33, 1, 0.68, 1) 2.6s infinite;
      }
      .in-ring + .in-ring {
        animation-delay: 1.1s, 3.6s;
      }
      .in-b {
        stroke-dasharray: 185 205;
        animation: in-draw-b 0.6s cubic-bezier(0.45, 0.05, 0.3, 1) 0.12s both;
      }
      .in-check {
        stroke-dasharray: 59 79;
        animation: in-draw-check 0.28s cubic-bezier(0.33, 1, 0.68, 1) 0.66s both;
      }

      /* The name, as it is written (§239): one word, the second half orange. */
      .in-words {
        position: absolute;
        left: 16px;
        right: 16px;
        top: calc(50% + var(--lift) + var(--tile) / 2 + 26px);
        text-align: center;
      }
      .in-name {
        font-size: clamp(24px, 8.2vw, 36px);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.15;
        color: #fff;
        white-space: nowrap;
        animation: in-up 0.48s cubic-bezier(0.33, 1, 0.68, 1) 1.14s both;
      }
      .in-name b {
        font-weight: 800;
        color: var(--orange);
      }
      /* Whose app this is, in the words its sign-in page uses. */
      .in-line {
        display: inline-block;
        margin-top: 14px;
        padding: 6px 13px;
        border-radius: 999px;
        background: rgba(253, 117, 17, 0.16);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: 0.01em;
        color: #ffb47e;
        animation: in-up 0.4s cubic-bezier(0.33, 1, 0.68, 1) 1.3s both;
      }

      @keyframes in-draw-b {
        from {
          stroke-dashoffset: 191;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes in-draw-check {
        from {
          stroke-dashoffset: 65;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes in-pop {
        0% {
          transform: scale(1);
        }
        28% {
          transform: scale(1.08);
        }
        62% {
          transform: scale(0.985);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes in-ring {
        0% {
          opacity: 0.6;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(2.2);
        }
      }
      @keyframes in-wait {
        0% {
          opacity: 0.35;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.8);
        }
      }
      @keyframes in-glow {
        from {
          opacity: 0;
          transform: scale(0.7);
        }
      }
      @keyframes in-lift {
        from {
          transform: none;
        }
      }
      @keyframes in-rise {
        from {
          transform: translateY(100%);
        }
      }
      @keyframes in-dawn {
        from {
          transform: translateY(var(--hill-h));
        }
      }
      @keyframes in-up {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
      }

      /* Leaving, once the picture is complete: the ground melts into the app
         underneath while the night lifts away like a curtain, the hills its
         edge, taking the sun, the mark and the name with it. */
      .in-leave .in-ground {
        opacity: 0;
        transition: opacity 0.22s cubic-bezier(0.33, 1, 0.68, 1);
      }
      .in-leave .in-sky,
      .in-leave .in-sun,
      .in-leave .in-center {
        transform: translateY(var(--away));
        transition: transform 0.6s cubic-bezier(0.32, 0, 0.67, 0);
      }
      .in-leave .in-hill {
        opacity: 0;
        transform: translateY(var(--away));
        transition:
          transform 0.6s cubic-bezier(0.32, 0, 0.67, 0),
          opacity 0.22s ease-out;
      }
      /* Leaving before it is complete, or with "reduce motion": a plain fade. */
      .in-quick {
        opacity: 0;
        transition: opacity 0.22s ease;
      }

      @media (prefers-reduced-motion: reduce) {
        #intro *,
        #intro *::before,
        #intro *::after {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="intro" aria-hidden="true">
      <div class="in-ground"></div>
      <div class="in-sky">
        <div class="in-sky-rise">
          <div class="in-night"></div>
          <svg viewBox="0 0 600 200" preserveAspectRatio="none">
            <path d="M0 0H600V150C566 142 516 130 456 134C396 138 362 160 300 160C240 160 210 139 150 132C96 126 40 134 0 146Z" />
          </svg>
        </div>
      </div>
      <div class="in-sun"><div class="in-glow"></div></div>
      <div class="in-hills">
        <div class="in-hill in-hill-1">
          <div class="in-rise">
            <svg viewBox="0 0 600 200" preserveAspectRatio="none">
              <path d="M0 80C40 64 76 54 112 56C156 58 186 88 232 90C276 92 320 34 400 30C470 26 520 58 560 66C578 70 590 72 600 72V200H0Z" />
            </svg>
          </div>
        </div>
        <div class="in-hill in-hill-2">
          <div class="in-rise">
            <svg viewBox="0 0 600 200" preserveAspectRatio="none">
              <path d="M0 112C24 104 44 100 66 102C110 106 140 134 190 132C232 130 250 94 300 92C356 90 384 128 432 132C470 135 494 118 524 116C556 114 580 124 600 130V200H0Z" />
            </svg>
          </div>
        </div>
      </div>
      <div class="in-center">
        <div class="in-mark">
          <span class="in-ring"></span>
          <span class="in-ring"></span>
          <div class="in-tile">
            <svg viewBox="0 0 136 136">
              <g transform="translate(20 20) scale(0.8)" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
                <path class="in-b" d="M30 18 C28 40 27 62 29 88 C31 100 40 106 50 104 C66 100 74 86 70 70 C66 58 50 54 36 64" stroke="#1f2a1f" />
                <path class="in-check" d="M72 70 L82 82 L106 46" stroke="#fd7511" />
              </g>
            </svg>
          </div>
        </div>
        <div class="in-words">
          <div class="in-name">Bwangu<b>Reservations</b></div>
          <div class="in-line">For businesses</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
