<!doctype html>
<!-- The share picture (§273), public/og.jpg: 1200×630, what a link to the site shows in WhatsApp,
     Facebook or X. Made from the real app screens in public/shots — when they are retaken, open this
     file in Chrome at 1200×630 (2× scale), screenshot, and save as public/og.jpg (JPEG, ~86 quality). -->
<html><head><meta charset="utf-8">
<style>@font-face { font-family: 'Plus Jakarta Sans'; font-weight: 400 800; src: url('../public/fonts/plus-jakarta-sans-latin.woff2') format('woff2'); }</style>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; color: #fff; position: relative;
    background:
      radial-gradient(circle 300px at -4% 40%, rgba(255,255,255,.055) 98%, transparent 100%),
      radial-gradient(700px 420px at 18% 100%, rgba(255,255,255,.09), transparent 70%),
      radial-gradient(520px 420px at 82% 46%, rgba(253,117,17,.24), transparent 70%),
      linear-gradient(180deg, #242e25 0%, #1e261e 55%, #1a211a 100%); }
  .brand { position: absolute; left: 64px; top: 56px; display: flex; align-items: center; gap: 14px; }
  .brand img { width: 52px; height: 52px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); }
  .brand span { font-size: 27px; font-weight: 800; letter-spacing: -0.03em; }
  .brand b { color: #fd7511; font-weight: 800; }
  .copy { position: absolute; left: 64px; top: 170px; width: 600px; }
  .eyebrow { font-size: 22px; font-weight: 600; color: rgba(255,255,255,.72); }
  h1 { margin-top: 16px; font-size: 66px; line-height: 1.04; font-weight: 800; letter-spacing: -0.045em; }
  h1 em { font-style: normal; color: #fd7511; }
  .chips { position: absolute; left: 64px; bottom: 58px; display: flex; gap: 10px; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 999px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); font-size: 17px; font-weight: 700; color: rgba(255,255,255,.9); }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: #fd7511; }
  .phone { position: absolute; width: 268px; padding: 9px; border-radius: 42px; background: #0f140f; box-shadow: 0 40px 80px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.08); }
  .phone img { display: block; width: 100%; border-radius: 34px; }
  .p1 { right: 252px; top: 92px; transform: rotate(-7deg); }
  .p2 { right: 18px; top: 52px; transform: rotate(5deg); }
</style></head>
<body>
  <div class="brand"><img src="../public/favicon.svg" alt=""><span>Bwangu<b>Reservations</b></span></div>
  <div class="copy">
    <p class="eyebrow">Your appointments, without the phone calls.</p>
    <h1>Book your next appointment, <em>easily.</em></h1>
  </div>
  <div class="chips"><span class="chip"><i></i>Real places</span><span class="chip"><i></i>MoMo deposit</span><span class="chip"><i></i>Code at the door</span></div>
  <figure class="phone p1"><img src="../public/shots/home.jpg" alt=""></figure>
  <figure class="phone p2"><img src="../public/shots/shop.jpg" alt=""></figure>
</body></html>
