<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F2A1F" />
    <title>BwanguReservations — Book real shops in Rwanda, quickly</title>
    <meta
      name="description"
      content="Book your next appointment at real shops near you. Pay a small deposit with MTN MoMo, show your 6-digit code at the door."
    />
    <meta property="og:title" content="BwanguReservations — Book real shops in Rwanda, quickly" />
    <meta
      property="og:description"
      content="Book your next appointment at real shops near you. Pay a small deposit with MTN MoMo, show your 6-digit code at the door."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BwanguReservations" />
    <!-- The share picture (§273). Full addresses: WhatsApp and Facebook ignore a picture
         given as "/og.jpg". %SITE_URL% is VITE_SITE_URL from the build (vite.config.ts). -->
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BwanguReservations: book your next appointment, easily — the app's Find a place and shop screens" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BwanguReservations — Book real shops in Rwanda, quickly" />
    <meta
      name="twitter:description"
      content="Book your next appointment at real shops near you. Pay a small deposit with MTN MoMo, show your 6-digit code at the door."
    />
    <meta name="twitter:image" content="%SITE_URL%/og.jpg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The apps' face (§133), so the site and the apps read as one product. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
